site_name: Amade Game Developer's Handbook
site_description: Learn game programming in Java by building the amadeOS games and their engine, one game at a time.
site_author: datazuul
site_url: https://datazuul.github.io/amade-game-engine/
repo_url: https://github.com/datazuul/amade-game-engine
edit_uri: edit/main/docs/handbook/chapters/
copyright: © 2026 datazuul.com · EUPL-1.2
docs_dir: chapters

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Code excerpts come from the game repositories, checked out next to amade-game-engine.
      # Run mkdocs from docs/handbook; a missing file or section fails the build.
      base_path: ["../../.."]
      check_paths: true

nav:
  - Preface: index.md
  - Getting Started:
      - 0. Setting Up: 00-setup.md
      - 1. Why Our Own Engine: 01-why-own-engine.md
      - 2. How a Game Is Built: 02-structure.md
  - "Part I: Games That Wait for You":
      - 10. Mines: 10-mines.md
      - 11. Solitaire: 11-solitaire.md
  - "Part II: Action":
      - 20. Paddle: 20-paddle.md
      - 21. Bricks: 21-bricks.md
      - 22. Snake: 22-snake.md
      - 23. Rocks: 23-rocks.md
      - 24. Swarm: 24-swarm.md
      - 25. Maze: 25-maze.md
      - 26. Blast: 26-blast.md
      - 27. Jump: 27-jump.md
      - 28. Hover Cab: 28-hover-cab.md
      - 29. Artillery: 29-artillery.md
  - "Part III: Strategy":
      - 30. Towers: 30-towers.md
      - 31. Sands: 31-sands.md
      - 32. Colony: 32-colony.md
      - 33. Town: 33-town.md
  - "Part IV: The Engine Manual":
      - 40. The Engine at a Glance: 40-engine.md
      - 41. Loop, Time and Drawing: 41-loop-and-drawing.md
      - 42. Sprites and Effects: 42-sprites.md
      - 43. Input: 43-input.md
      - 44. Movement, Physics and Collision: 44-movement.md
      - 45. Maps, Camera and Fog: 45-maps.md
      - 46. Paths, Groups and Decisions: 46-paths-and-decisions.md
      - 47. Chance, Data and Saving: 47-data-and-saving.md
      - 48. Scenes, Menus and Sound: 48-scenes-menus-sound.md
      - 49. Rooms, Scripts and Dialogs: 49-adventure.md
  - "Part V: Stories":
      - 50. The Seal of the Templars: 50-templar.md
  - Appendices:
      - Java2D and X11 Pitfalls: appendix-java2d.md
      - Glossary: appendix-glossary.md
  - The Road Ahead: roadmap.md
