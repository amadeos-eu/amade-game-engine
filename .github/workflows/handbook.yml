name: Handbook

# Builds the Amade Game Developer's Handbook (docs/handbook) and publishes it on GitHub Pages.
# The code excerpts come from the game repositories, checked out next to this one at the commits
# below, the state the chapters describe. Raise a commit when a chapter is updated for it.

on:
  push:
    branches: [main]
    paths: ['docs/handbook/**', '.github/workflows/handbook.yml']
  pull_request:
    paths: ['docs/handbook/**', '.github/workflows/handbook.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full hashes: actions/checkout does not take short ones.
  MINES_COMMIT: f6e2311f742e34058532ac88447daafbda666c53
  SOLITAIRE_COMMIT: a66304918ac690a5b2a359fb9135e02006dc372f
  PADDLE_COMMIT: d46a718b81ba36c4d567766c50f300655b86cf9f
  BRICKS_COMMIT: 1519d96fa8f5caeee40fa8f7a5b034ae39e98b6e
  SNAKE_COMMIT: 17ae70ec4d546683ed5d2a3dbf712b2c17cd5f71
  ROCKS_COMMIT: eb73d9ea71d746dc56ec03372cda9ae1f4961c18
  SWARM_COMMIT: e5c1b2e2953c68f8706993843d546cd73f9614f2
  MAZE_COMMIT: e5ad67702cfa42cd7216041294c9c31a48508c71
  BLAST_COMMIT: 05cfb6c9ade2f8fb63852d2b8c86dac55cce2840
  JUMP_COMMIT: 4f753fe859573297ba28f4440556d30234f59f87
  TOWERS_COMMIT: 577c6ac97e49e9db9877b265ffbfccdbe4eeb1b1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: amade-game-engine
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-mines-game
          ref: ${{ env.MINES_COMMIT }}
          path: amade-mines-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-solitaire-game
          ref: ${{ env.SOLITAIRE_COMMIT }}
          path: amade-solitaire-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-paddle-game
          ref: ${{ env.PADDLE_COMMIT }}
          path: amade-paddle-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-bricks-game
          ref: ${{ env.BRICKS_COMMIT }}
          path: amade-bricks-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-snake-game
          ref: ${{ env.SNAKE_COMMIT }}
          path: amade-snake-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-rocks-game
          ref: ${{ env.ROCKS_COMMIT }}
          path: amade-rocks-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-swarm-game
          ref: ${{ env.SWARM_COMMIT }}
          path: amade-swarm-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-maze-game
          ref: ${{ env.MAZE_COMMIT }}
          path: amade-maze-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-blast-game
          ref: ${{ env.BLAST_COMMIT }}
          path: amade-blast-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-jump-game
          ref: ${{ env.JUMP_COMMIT }}
          path: amade-jump-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-towers-game
          ref: ${{ env.TOWERS_COMMIT }}
          path: amade-towers-game
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install MkDocs
        run: pip install -r amade-game-engine/docs/handbook/requirements.txt
      # Strict: a broken link or a missing code excerpt fails the build.
      - name: Build
        working-directory: amade-game-engine/docs/handbook
        run: mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
