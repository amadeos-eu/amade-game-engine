name: Handbook

# Builds the Amade Game Developer's Handbook (docs/handbook) and publishes it on GitHub Pages.
# The code excerpts come from the game repositories, checked out next to this one at the commits
# below, the state the chapters describe. Raise a commit when a chapter is updated for it.

on:
  push:
    branches: [main]
    paths: ['docs/handbook/**', '.github/workflows/handbook.yml']
  pull_request:
    paths: ['docs/handbook/**', '.github/workflows/handbook.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full hashes: actions/checkout does not take short ones.
  MINES_COMMIT: f6e2311f742e34058532ac88447daafbda666c53
  SOLITAIRE_COMMIT: a66304918ac690a5b2a359fb9135e02006dc372f
  PADDLE_COMMIT: d46a718b81ba36c4d567766c50f300655b86cf9f
  BRICKS_COMMIT: 1519d96fa8f5caeee40fa8f7a5b034ae39e98b6e
  SNAKE_COMMIT: 17ae70ec4d546683ed5d2a3dbf712b2c17cd5f71

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: amade-game-engine
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-mines-game
          ref: ${{ env.MINES_COMMIT }}
          path: amade-mines-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-solitaire-game
          ref: ${{ env.SOLITAIRE_COMMIT }}
          path: amade-solitaire-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-paddle-game
          ref: ${{ env.PADDLE_COMMIT }}
          path: amade-paddle-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-bricks-game
          ref: ${{ env.BRICKS_COMMIT }}
          path: amade-bricks-game
      - uses: actions/checkout@v7
        with:
          repository: datazuul/amade-snake-game
          ref: ${{ env.SNAKE_COMMIT }}
          path: amade-snake-game
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install MkDocs
        run: pip install -r amade-game-engine/docs/handbook/requirements.txt
      # Strict: a broken link or a missing code excerpt fails the build.
      - name: Build
        working-directory: amade-game-engine/docs/handbook
        run: mkdocs build --strict --site-dir "$GITHUB_WORKSPACE/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
