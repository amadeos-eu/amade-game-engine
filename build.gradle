plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

// JitPack publishes under com.github.<owner>; using the same coordinates locally lets a game's
// composite build (includeBuild '../amade-game-engine') replace the JitPack dependency automatically.
group = 'com.github.amadeos-eu'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
// Games take released versions from JitPack by tag (com.github.amadeos-eu:amade-game-engine:v1.0.0).
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.0 before 1.1.0 (with - it would sort after it).
def debVersion = project.version.toString().replace('-', '~')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // The sources and javadoc jars, which Maven Central requires, come from mavenPublishing below.
}

// Releases from main also go to Maven Central as eu.amadeos:amade-game-engine; the release workflow passes
// -PmavenCentral. Every other build keeps the JitPack coordinates, so the games' pins and composite builds still match.
// Operating steps (Central Portal, signing key, secrets): chapter 8 of the amadeOS Betriebshandbuch.
def centralRelease = providers.gradleProperty('mavenCentral').isPresent()
// The amade-commons this engine builds on, pinned on JitPack: a commit on develop, a release tag (vX.Y.Z) before
// main (Promote checks this pin). On Maven Central the same release is eu.amadeos:amade-commons:X.Y.Z.
def commonsDependency = 'com.github.amadeos-eu:amade-commons:fac730fed3'
if (centralRelease) {
    def commonsPin = commonsDependency.tokenize(':').last()
    def release = commonsPin =~ /^v(\d+\.\d+\.\d+)$/
    if (!release.matches()) {
        throw new GradleException("Maven Central needs an amade-commons release, but the pin is '${commonsPin}'. " +
                'Release amade-commons first and pin its tag (vX.Y.Z).')
    }
    commonsDependency = 'eu.amadeos:amade-commons:' + release.group(1)
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Theme, Motif look, start-up, XDG and i18n helpers; games get them through this library.
    // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
    // The pin itself is commonsDependency above.
    api commonsDependency

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    // XInput is called through java.lang.foreign; without this, Java warns about it.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'amade-game-engine',
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'eu.amadeos.gameengine'
        )
    }
}

mavenPublishing {
    coordinates(centralRelease ? 'eu.amadeos' : project.group.toString(), 'amade-game-engine', project.version.toString())
    if (centralRelease) {
        publishToMavenCentral(true)
        signAllPublications()
    }
    pom {
        name = 'amade-game-engine'
        description = 'Game library for amadeOS games: high scores, game menu, game loop, rendering and input'
        url = 'https://github.com/amadeos-eu/amade-game-engine'
        licenses {
            license {
                name = 'EUPL-1.2'
                url = 'https://interoperable-europe.ec.europa.eu/collection/eupl/eupl-text-eupl-12'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'datazuul'
                name = 'Ralf Eichinger'
                email = 'developers@datazuul.com'
                url = 'https://github.com/datazuul'
            }
        }
        organization {
            name = 'amadeOS'
            url = 'https://www.amadeos.eu'
        }
        scm {
            url = 'https://github.com/amadeos-eu/amade-game-engine'
            connection = 'scm:git:https://github.com/amadeos-eu/amade-game-engine.git'
            developerConnection = 'scm:git:ssh://git@github.com/amadeos-eu/amade-game-engine.git'
        }
        issueManagement {
            system = 'GitHub'
            url = 'https://github.com/amadeos-eu/amade-game-engine/issues'
        }
    }
}

// The handbook as the Debian package amade-game-handbook (docs/handbook/package-deb.sh), which the
// amadeOS image installs; the Help drawer of the Front Panel lists it.
tasks.register('handbookDeb', Exec) {
    description = 'Builds the Debian package amade-game-handbook (the handbook for reading offline)'
    group = 'distribution'
    commandLine 'docs/handbook/package-deb.sh', debVersion, layout.buildDirectory.dir('distributions').get().asFile.absolutePath
}

tasks.register('installToAmadeOs') {
    dependsOn 'handbookDeb'
    description = 'Builds and drops the handbook package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-game-handbook_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}
